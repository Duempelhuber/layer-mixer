name: Release

# On every push to main: if the version in build.py has no GitHub release yet,
# build the tool, run the tests, build the Windows installer on a Windows runner
# and publish the release (tag, layer-mixer.html, layer-mixer-setup.exe,
# change log entry). Pushes without a new version are skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      app: ${{ steps.version.outputs.app }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import re;print(re.search(r'^VERSION = \"([^\"]+)\"', open('build.py').read(), re.M).group(1))")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "app=$version.0" >> "$GITHUB_OUTPUT"   # Windows wants three numbers: 0.45 -> 0.45.0
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists, nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  html:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: python3 build.py

      - name: Tests
        run: |
          npm install --no-save playwright@1.65.0
          npx playwright install --with-deps chromium
          node tests/run-tests.js

      - name: Release notes from ChangeLog.txt
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          awk -v tag="$TAG" '$1==tag{found=1;next} found&&/^v[0-9]/{exit} found' ChangeLog.txt \
            | sed '1{/^-*$/d}' > release-notes.md
          if [ ! -s release-notes.md ]; then echo "No ChangeLog entry for $TAG"; exit 1; fi
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: |
            dist/layer-mixer.html
            release-notes.md

  windows:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build the page
        run: |
          python build.py
          mkdir -p desktop/web
          cp dist/layer-mixer.html desktop/web/index.html

      - name: Build the installer
        working-directory: desktop
        env:
          APP_VERSION: ${{ needs.version.outputs.app }}
        run: |
          npm ci
          npx tauri build --config "{\"version\":\"$APP_VERSION\"}"
          cp "src-tauri/target/release/bundle/nsis/Layer Mixer_${APP_VERSION}_x64-setup.exe" ../layer-mixer-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: layer-mixer-setup.exe

  release:
    needs: [version, html, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -l out out/dist
          gh release create "$TAG" out/dist/layer-mixer.html out/layer-mixer-setup.exe \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Layer Mixer $TAG" --notes-file out/release-notes.md
