<title>Layer Mixer</title>
<style>
/* Layout: workbench. Paint chart with one tab per paint range on the left, test sphere + recipe on the right. Dark only, so paints read as on a swatch card. */
:root{
  color-scheme:dark;
  --bg:#141416;          /* workbench */
  --panel:#1c1c20;       /* surfaces */
  --panel-2:#232328;     /* raised / hover */
  --bench:#17171a;       /* right column */
  --line:#2c2c33;        /* dividers */
  --line-strong:#3a3a43;
  --fg:#e9e7e3;          /* text */
  --muted:#a3a1ab;       /* secondary text */
  --accent:#e6b84a;      /* active layer, focus, selection */
  --on-accent:#1a1405;
  --tip-bg:#0d0d0f;
  --font-display:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","DejaVu Sans Condensed",system-ui,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --r-sm:2px; --r-md:4px; --r-lg:6px;
  --header-h:64px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---- App frame ---- */
header.top{height:var(--header-h);display:flex;align-items:center;gap:24px;padding:0 24px;border-bottom:1px solid var(--line)}
h1{font-family:var(--font-display);font-stretch:condensed;font-weight:700;font-size:26px;letter-spacing:.05em;text-transform:uppercase;margin:0;line-height:1;white-space:nowrap}
h1 span{color:var(--accent)}
.hint{color:var(--muted);margin:0;font-size:13px;max-width:100ch}
.version{margin-left:auto;color:var(--muted);font:12px var(--font-mono);white-space:nowrap}
h2{font-family:var(--font-display);font-stretch:condensed;font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.app{height:calc(100% - var(--header-h));display:grid;grid-template-columns:minmax(0,1fr) 440px}
.pane{min-height:0;overflow:auto;scrollbar-color:var(--line-strong) transparent}

/* ---- Swatch ---- */
.sw{appearance:none;border:0;padding:0;cursor:pointer;border-radius:var(--r-sm);position:relative;display:block;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);transition:transform .08s}
.sw:hover{transform:translateY(-1px);box-shadow:0 0 0 2px var(--fg);z-index:2}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px;z-index:3}
.sw.used{box-shadow:0 0 0 2px var(--accent)}
.sw .n{position:absolute;left:2px;bottom:2px;font:700 9px/1 var(--font-mono);color:#fff;text-shadow:0 0 2px #000,0 0 1px #000}
.sw .tm{position:absolute;left:0;top:0;width:0;height:0;border-style:solid;border-width:9px 9px 0 0;border-color:rgba(255,255,255,.88) transparent transparent transparent;
  border-top-left-radius:var(--r-sm);filter:drop-shadow(0 0 1px rgba(0,0,0,.95))}
.sw.info{cursor:help;opacity:.55}
.sw.info:hover{opacity:.8}
.sw.nope{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#tip .tip-target{color:var(--accent);font-weight:600}
#tip .tip-ref{color:#d9b8f0}
.sw.info:hover{transform:none}
.sw.metal{background-image:linear-gradient(135deg,rgba(255,255,255,0) 18%,rgba(255,255,255,.42) 44%,rgba(255,255,255,0) 60%,rgba(0,0,0,.22) 100%)}
.sw.wash{background-image:linear-gradient(155deg,rgba(255,255,255,.30) 0,rgba(255,255,255,0) 42%),repeating-linear-gradient(-45deg,rgba(255,255,255,.16) 0 1.5px,transparent 1.5px 5px)}
.key-notch{display:inline-block;width:0;height:0;border-style:solid;border-width:9px 9px 0 0;border-color:var(--fg) transparent transparent transparent;vertical-align:-1px;margin-right:4px}
.sw .slot-mark{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;background:var(--accent);color:var(--on-accent);
  font:700 9px/16px var(--font-mono);text-align:center;box-shadow:0 0 0 2px var(--bg);z-index:4}

/* ---- Tooltip (hover + keyboard focus) ---- */
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--tip-bg);border:1px solid var(--line-strong);border-radius:var(--r-md);
  padding:8px 10px 8px 8px;display:none;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:300px}
#tip.on{display:flex}
#tip .chip{width:34px;height:34px;border-radius:var(--r-sm);flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
#tip b{display:block;font-size:14px;font-weight:600;line-height:1.2}
#tip small{display:block;color:var(--muted);font-size:12px;line-height:1.35}

/* ---- Range tag ---- */
.rtag{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1 var(--font-display);font-stretch:condensed;letter-spacing:.09em;text-transform:uppercase;
  color:#d6d4dc;background:#26262c;border-radius:var(--r-sm);padding:3px 6px 3px 5px;white-space:nowrap}
.rtag::before{content:"";width:3px;height:10px;border-radius:1px;background:var(--rc,#888)}

/* ---- Chart: brand tabs + range pills + strips ---- */
.chart{display:flex;flex-direction:column;min-height:0}
.inrec{font:700 10px/1 var(--font-mono);background:var(--accent);color:var(--on-accent);border-radius:8px;padding:3px 6px;letter-spacing:0;text-transform:none;white-space:nowrap}
.inrec.dot{min-width:17px;height:17px;padding:0 5px;line-height:17px;text-align:center;border-radius:9px}
.brandbar{display:flex;align-items:flex-end;gap:4px;padding:10px 24px 0;border-bottom:1px solid var(--line);flex:none}
.btab{appearance:none;cursor:pointer;background:transparent;border:1px solid transparent;border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:8px 16px 9px;position:relative;top:1px;color:var(--muted);display:flex;align-items:center;gap:8px;
  font:700 18px/1.1 var(--font-display);font-stretch:condensed;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.btab:hover{color:var(--fg);background:#18181b}
.btab[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--fg)}
.btab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;top:-1px;height:2px;background:var(--accent);border-radius:2px}
.toolbar{display:flex;align-items:center;gap:16px;padding:8px 24px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;min-height:50px}
.pills{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden}
.pill{appearance:none;cursor:pointer;background:transparent;border:0;border-left:1px solid var(--line-strong);padding:7px 12px;display:flex;align-items:center;gap:7px;color:#c7c5cf;
  font:600 13px/1 var(--font-display);font-stretch:condensed;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.pill:first-child{border-left:0}
.pill:hover{background:var(--panel-2);color:var(--fg)}
.pill[aria-selected="true"]{background:#2b2618;color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.pill:focus-visible{outline-offset:-2px}
.pill .ref{font:400 11px/1 var(--font-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.toolbar .legend{margin-left:auto;color:var(--muted);font-size:12px;text-align:right;line-height:1.45}
.toolbar .legend b{color:var(--accent);font-weight:600}
@media (max-width:1250px){.toolbar .legend{display:none}}
.info-note{display:flex;gap:10px;align-items:flex-start;border:1px dashed #5a5866;border-radius:var(--r-md);padding:9px 12px;color:#d9d5e0;font-size:13px;max-width:90ch}
.panelbody{padding:18px 24px 24px;display:flex;flex-direction:column;gap:18px}
.strips{columns:2;column-gap:36px}
@media (max-width:1250px){.strips{columns:1}}
.strip{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;gap:12px;padding:5px 0;break-inside:avoid;border-bottom:1px solid #1d1d21}
.strip .label{font:600 13px/1.15 var(--font-display);font-stretch:condensed;letter-spacing:.07em;text-transform:uppercase;color:var(--fg)}
.strip .label small{display:block;font:400 11px/1.3 var(--font-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.strip .ramp{display:flex;flex-wrap:wrap;gap:6px 2px;padding:3px 0}
.strip .sw{width:40px;height:34px}
.notes{color:var(--muted);font-size:12px;max-width:110ch;margin:0;border-top:1px solid var(--line);padding-top:14px}
.notes p{margin:0 0 4px}
.notes .credit{margin-top:10px;color:var(--fg)}

/* ---- Bench: sphere + recipe ---- */
.bench{border-left:1px solid var(--line);background:var(--bench);padding:18px 20px 28px;display:flex;flex-direction:column;gap:18px}
.stage-top{display:flex;gap:18px;align-items:center}
canvas#sphere{width:190px;height:190px;flex:none;cursor:grab;touch-action:none;border-radius:50%}
canvas#sphere.dragging{cursor:grabbing}
.stage-ctl{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.btn{appearance:none;cursor:pointer;background:transparent;color:var(--fg);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:6px 10px;
  font-family:var(--font-display);font-stretch:condensed;font-weight:600;font-size:13px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg{display:flex}
.seg .btn{border-radius:0;flex:1}
.seg .btn:first-child{border-radius:var(--r-md) 0 0 var(--r-md)}
.seg .btn:last-child{border-radius:0 var(--r-md) var(--r-md) 0;border-left:0}
.btn-row{display:flex;gap:6px}.btn-row .btn{flex:1}
.status{color:var(--muted);font-size:12px;min-height:1.2em;margin:0;overflow-wrap:anywhere}

.recipe{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.slot{display:grid;grid-template-columns:78px 34px minmax(0,1fr) 22px;gap:10px;align-items:center;padding:5px 6px;border-radius:var(--r-md);
  border:1px solid transparent;cursor:pointer;background:transparent;text-align:left;width:100%}
.slot:hover{background:var(--panel-2)}
.slot.active{border-color:var(--accent);background:#211e16}
.slot .lname{font:600 12px/1.1 var(--font-display);font-stretch:condensed;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.slot.active .lname{color:var(--accent)}
.slot .chipbig{width:34px;height:34px;border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.slot .chipbig.empty{border:1px dashed var(--line-strong);box-shadow:none}
.slot .pname{display:block;font-size:14px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .pmeta{display:flex;gap:6px;align-items:center;margin-top:3px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
.slot .ph{color:var(--muted);font-size:13px}
.slot .x{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px;border-radius:var(--r-sm)}
.slot .x:hover{color:var(--fg)}

.section{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.shop-head{display:flex;justify-content:space-between;align-items:baseline}
.shop-head span{color:var(--muted);font-size:12px}
.shop ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.shop li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;align-items:start;font-size:13px}
.empty-note{color:var(--muted);font-size:13px;margin:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
#saved{display:contents}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:transparent;color:var(--fg);
  padding:5px 8px;cursor:pointer;font-size:13px}
.chip:hover{border-color:var(--muted)}
.chip .dots{display:inline-flex}
.chip .dots b{width:10px;height:10px;display:block}
.chip-wrap{display:inline-flex;align-items:stretch}
.chip-wrap .chip{border-radius:var(--r-md) 0 0 var(--r-md)}
.chip-wrap .del{border:1px solid var(--line-strong);border-left:0;border-radius:0 var(--r-md) var(--r-md) 0;background:transparent;color:var(--muted);cursor:pointer;padding:0 8px}
.chip-wrap .del:hover{color:var(--fg)}
.save-row{display:flex;gap:8px}
.save-row input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:6px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>Layer <span>Mixer</span></h1>
  <span class="version" id="version"></span>
</header>
<div class="app">
  <section class="chart" aria-label="Paint chart">
    <div class="brandbar" role="tablist" aria-label="Brand" id="brands"></div>
    <div class="toolbar"><div id="ranges"></div></div>
    <div class="pane panelbody" id="panel" role="tabpanel">
      <div class="strips" id="strips"></div>
      <div class="notes" id="notes"></div>
    </div>
  </section>
  <aside class="pane bench" id="bench" aria-label="Sphere and recipe">
    <div class="stage-top">
      <canvas id="sphere" width="380" height="380" tabindex="0" role="img" title="Drag to move the light. Double-click to reset." aria-label="Sphere showing the layered recipe. Drag or use the arrow keys to move the light."></canvas>
      <div class="stage-ctl">
        <h2>Sphere</h2>
        <div class="seg" role="group" aria-label="Blending">
          <button class="btn" id="mode-smooth" type="button" aria-pressed="true">Smooth</button>
          <button class="btn" id="mode-steps" type="button" aria-pressed="false">Stepped</button>
        </div>
        <div class="btn-row">
          <button class="btn" id="btn-light" type="button">Reset light</button>
          <button class="btn" id="btn-clear" type="button">Clear</button>
        </div>
        <button class="btn" id="btn-copy" type="button">Copy recipe</button>
        <p class="status" id="status" role="status"></p>
      </div>
    </div>
    <div>
      <h2>Recipe</h2>
      <div class="recipe" id="recipe"></div>
    </div>
    <div class="section shop" id="shop"></div>
    <div class="section">
      <h2>Recipes</h2>
      <div class="chips" id="presets"><span class="chips" id="saved"></span></div>
      <form class="save-row" id="save-form">
        <input id="save-name" type="text" maxlength="40" placeholder="Save current recipe as …" aria-label="Recipe name">
        <button class="btn" type="submit">Save</button>
      </form>
    </div>
  </aside>
</div>

function el(tag, props={}, kids=[]){

    else if(k==="text") e.textContent=v;

    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);

}
function buildStrips(){
  const r=RANGE_BY_KEY[current], box=$("#strips"); box.replaceChildren();
  r.rows.forEach(row=>{
    box.append(el("div",{class:"strip"},[
      el("div",{class:"label"},[row.label, row.family ? el("small",{text:row.family}) : null]),
      el("div",{class:"ramp"},row.paints.map(swatch))]));
  });
  $("#panel").scrollTop=0;
}
function buildNotes(){
  $("#notes").replaceChildren(
    el("p",{text:"Screen colours – compare on the model. Not affiliated with Games Workshop or The Army Painter."}),
    el("p",{class:"credit",text:`Layer Mixer v${VERSION} · Vibecoded by Duempelhuber`}));
}

/* ---------- tooltip ---------- */
const tip = el("div",{id:"tip",role:"tooltip"});
document.body.append(tip);
function showTip(b){
  const p=BY_ID[b.dataset.id];
  tip.replaceChildren(el("span",{class:"chip",style:{background:p.hex}}),
    el("div",{},[el("b",{text:p.name}),
      p.tone?null:el("small",{text:[p.row,typeText(p.type)].filter(Boolean).join(" · ")}),
      p.info ? el("small",{class:"tip-ref",text:p.wash?"Shade · reference only":p.metal?"Metallic · reference only":"Reference only"})
             : el("small",{class:"tip-target"},["→ ",SLOT_NAMES[active]])]));
  tip.classList.add("on");
  const r=b.getBoundingClientRect(), t=tip.getBoundingClientRect();
  /* below the swatch if it would cover the tab bar */
  const bar=$("#panel").getBoundingClientRect().top;
  let x=r.left+r.width/2-t.width/2, y=r.top-t.height-8;
  if(y<bar+4) y=r.bottom+8;
  x=Math.max(8,Math.min(innerWidth-t.width-8,x));
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
function hideTip(){ tip.classList.remove("on"); }

/* ---------- actions ---------- */
function pick(id){
  if(BY_ID[id].info){ const b=document.querySelector(`.sw[data-id="${CSS.escape(id)}"]`); if(b){ b.classList.remove("nope"); void b.offsetWidth; b.classList.add("nope"); showTip(b); } return; }
  const slot=active;
  layers[slot]=id;
  const next=layers.findIndex((l,i)=>i>slot&&!l);
  if(next!==-1) active=next; else if(slot<SLOT_NAMES.length-1) active=slot+1;
  render(); say("");
  const b=document.querySelector(`.sw[data-id="${CSS.escape(id)}"]`); if(b&&b.matches(":hover,:focus")) showTip(b);
}
function load(ls){ layers=cleanLayers(ls); active=0; render(); say(""); }

/* ---------- recipe ---------- */
function renderRecipe(){
  const box=$("#recipe"); box.replaceChildren();
  layers.forEach((id,i)=>{
    const p=id?BY_ID[id]:null;
    box.append(el("div",{class:"slot"+(i===active?" active":""),role:"button",tabindex:"0","data-slot":String(i),
      "aria-pressed":String(i===active),
      "aria-label":`${SLOT_NAMES[i]}: ${p?`${p.name}, ${p.brand} ${p.range}`:"empty"}. Select to change`,
      onclick:()=>{active=i;render();},
      onkeydown:e=>{ if(e.target===e.currentTarget&&(e.key==="Enter"||e.key===" ")){e.preventDefault();active=i;render();} }},[
      el("span",{class:"lname",text:SLOT_NAMES[i]}),
      el("span",{class:"chipbig"+(p?"":" empty"),style:p?{background:p.hex}:{}}),
      p ? el("span",{style:{minWidth:"0"}},[el("span",{class:"pname",text:p.name}), el("span",{class:"pmeta"},[rtag(p.key), el("span",{text:detail(p)})])])
        : el("span",{class:"ph",text:i===active?"Pick a paint in the chart…":"Empty"}),
      p ? el("button",{class:"x",type:"button","aria-label":`Clear ${SLOT_NAMES[i].toLowerCase()}`,title:"Clear",
            onclick:e=>{e.stopPropagation();layers[i]=null;active=i;render();}},["×"]) : el("span")
    ]));
  });
}
function renderShop(){
  const box=$("#shop"); box.replaceChildren();
  /* one entry per pot; numbered ranges (Tone Pro) are grouped by colour: "Ultramar Blue 1, 2, 5" */
  const groups={};
  layers.filter(Boolean).forEach(id=>{ const p=BY_ID[id], g=(groups[p.key]=groups[p.key]||new Map());
    if(p.tone){ const set=g.get(p.row)||new Set(); set.add(p.tone); g.set(p.row,set); } else g.set(p.name,null); });
  const n=Object.keys(groups).length;
  box.hidden=!n; if(!n) return;
  box.append(el("div",{class:"shop-head"},[el("h2",{text:"Paints needed"}), el("span",{text:`${n} range${n===1?"":"s"}`})]));
  const items=g=>[...g].map(([name,tones])=>tones?`${name} ${[...tones].sort((a,b)=>a-b).join(", ")}`:name).join(" · ");
  box.append(el("ul",{},Object.entries(groups).map(([k,g])=>el("li",{},[rtag(k),el("span",{text:items(g)})]))));
}
function markUsed(){
  document.querySelectorAll(".sw").forEach(b=>{
    const i=layers.indexOf(b.dataset.id);
    b.classList.toggle("used",i!==-1);
    b.querySelector(".slot-mark")?.remove();
    if(i!==-1) b.append(el("span",{class:"slot-mark","aria-hidden":"true",text:SLOT_ABBR[i]}));
  });
  document.querySelectorAll(".inrec[data-k]").forEach(b=>{ const n=countRange(b.dataset.k); b.textContent=String(n); b.hidden=!n; b.title=`${n} in recipe`; });
  document.querySelectorAll(".inrec[data-b]").forEach(b=>{ const n=countBrand(BRANDS.find(x=>x.name===b.dataset.b)); b.textContent=`${n} in recipe`; b.hidden=!n; });
  const lg=$("#lg-layer"); if(lg) lg.textContent=SLOT_NAMES[active];
}

/* ---------- sphere ---------- */
const cv=$("#sphere"), ctx=cv.getContext("2d");
/* light direction: x right, y down, z towards the viewer; set by dragging on the sphere or with the arrow keys */
const DEFAULT_LIGHT=[0.55,-0.6];
let light=[0,0,1];
function setLight(x,y){
  let r=Math.hypot(x,y); if(r>1){ x/=r; y/=r; r=1; }
  const z=Math.max(0.25,Math.sqrt(Math.max(0,1-r*r)));
  const n=Math.hypot(x,y,z); light=[x/n,y/n,z/n]; lightXY=[x,y];
  drawSphere();
}
let lightXY=[...DEFAULT_LIGHT];
function lightFromPointer(e){
  const b=cv.getBoundingClientRect(), R=b.width/2*(1-6/190);
  setLight((e.clientX-b.left-b.width/2)/R,(e.clientY-b.top-b.height/2)/R);
}
let dragging=false;
cv.addEventListener("pointerdown",e=>{ dragging=true; cv.classList.add("dragging"); try{cv.setPointerCapture(e.pointerId);}catch(_){} lightFromPointer(e); });
cv.addEventListener("pointermove",e=>{ if(dragging) lightFromPointer(e); });
const endDrag=()=>{ dragging=false; cv.classList.remove("dragging"); };
cv.addEventListener("pointerup",endDrag); cv.addEventListener("pointercancel",endDrag);
cv.addEventListener("dblclick",()=>setLight(...DEFAULT_LIGHT));
cv.addEventListener("keydown",e=>{
  const step=0.1, m={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]}[e.key];
  if(m){ e.preventDefault(); setLight(lightXY[0]+m[0],lightXY[1]+m[1]); }
  else if(e.key==="Home"){ e.preventDefault(); setLight(...DEFAULT_LIGHT); }
});
function colorAt(cols,t){const n=cols.length;
  if(stepped) return cols[Math.min(n-1,Math.floor(t*n))];
  const x=t*(n-1),i=Math.min(n-2,Math.floor(x)),f=x-i,a=cols[i],b=cols[i+1];
  return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];}
function drawSphere(){
  const W=cv.width,H=cv.height,R=W/2-6,cx=W/2,cy=H/2;
  ctx.clearRect(0,0,W,H);
  let cols=layers.filter(Boolean).map(id=>hexToRgb(BY_ID[id].hex));
  /* a single paint still gets light and shadow: darker and lighter versions of the same colour */
  if(cols.length===1){ const c=cols[0]; cols=[c.map(v=>v*.42), c, c.map(v=>v+(255-v)*.22)]; }
  if(!cols.length){ctx.strokeStyle="#3a3a42";ctx.setLineDash([10,8]);ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);return;}
  const img=ctx.createImageData(W,H),d=img.data;const L=light;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const nx=(x+.5-cx)/R,ny=(y+.5-cy)/R,r2=nx*nx+ny*ny;if(r2>1)continue;
    const nz=Math.sqrt(1-r2);let t=nx*L[0]+ny*L[1]+nz*L[2];t=Math.max(0,Math.min(1,(t+0.35)/1.35));t=Math.pow(t,1.15);
    let c=colorAt(cols,t);
    const edge=Math.min(1,(1-Math.sqrt(r2))*R/1.2),o=(y*W+x)*4;d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=255*edge;}
  ctx.putImageData(img,0,0);
}
function setMode(s){ stepped=s; $("#mode-smooth").setAttribute("aria-pressed",String(!s)); $("#mode-steps").setAttribute("aria-pressed",String(s)); drawSphere(); }

/* ---------- examples + saved recipes ---------- */
function dots(ls){
  return el("span",{class:"dots","aria-hidden":"true"},ls.filter(id=>id&&BY_ID[id]).slice(0,5).map(id=>el("b",{style:{background:BY_ID[id].hex}})));
}
function buildPresets(){
  const saved=$("#saved");
  $("#presets").replaceChildren(...PRESETS.map(p=>el("button",{class:"chip",type:"button",onclick:()=>load(p.layers,p.name)},[dots(p.layers),p.name])), saved);
}
function migrateOld(){
  /* recipes saved by the earlier Tone Pro only version: [[paint, tone], …] */
  try{
    const old=JSON.parse(localStorage.getItem(OLD_STORE_KEY)||"null");
    if(!Array.isArray(old)||localStorage.getItem(STORE_KEY)) return;
    const conv=old.filter(r=>r&&typeof r.name==="string"&&Array.isArray(r.layers))
      .map(r=>({name:r.name.slice(0,40),layers:cleanLayers(r.layers.map(l=>Array.isArray(l)?`tp:${l[0]} ${l[1]}`:null))}));
    localStorage.setItem(STORE_KEY,JSON.stringify(conv));
  }catch(e){}
}
function readSaved(){ try{ const v=JSON.parse(localStorage.getItem(STORE_KEY)||"[]"); return Array.isArray(v)?v.filter(r=>r&&typeof r.name==="string"&&Array.isArray(r.layers)):[]; }catch(e){ return []; } }
function writeSaved(list){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(list)); return true; }catch(e){ return false; } }
function renderSaved(){
  const box=$("#saved"), list=readSaved(); box.replaceChildren();
  list.forEach((r,idx)=>box.append(el("span",{class:"chip-wrap"},[
    el("button",{class:"chip",type:"button",onclick:()=>load(r.layers,r.name)},[dots(r.layers),r.name]),
    el("button",{class:"del",type:"button","aria-label":`Delete ${r.name}`,title:"Delete",
      onclick:()=>{const l=readSaved();l.splice(idx,1);writeSaved(l);renderSaved();say(`“${r.name}” deleted.`);}},["×"])])));
}
$("#save-form").addEventListener("submit",e=>{
  e.preventDefault();
  const name=$("#save-name").value.trim().slice(0,40);
  if(!name){ say("Enter a name first."); return; }
  if(!layers.some(Boolean)){ say("The recipe is empty. Pick some paints first."); return; }
  const list=readSaved(), i=list.findIndex(r=>r.name===name), entry={name,layers:[...layers]};
  if(i>=0) list[i]=entry; else list.push(entry);
  if(writeSaved(list)){ $("#save-name").value=""; renderSaved(); say(`“${name}” saved in this browser.`); }
  else say("Saving isn’t available in this browser right now.");
});

/* ---------- copy as text ---------- */
function recipeText(){
  return layers.map((id,i)=>id?`${SLOT_NAMES[i]}: ${BY_ID[id].name} (${BY_ID[id].brand} ${BY_ID[id].range})`:null).filter(Boolean).join("\n");
}
$("#btn-copy").addEventListener("click",()=>{
  const t=recipeText(); if(!t){ say("The recipe is empty."); return; }
  const fallback=()=>say(t.replace(/\n/g," · "));
  try{ navigator.clipboard.writeText(t).then(()=>say("Recipe copied to clipboard."),fallback); }catch(e){ fallback(); }
});
$("#btn-light").addEventListener("click",()=>setLight(...DEFAULT_LIGHT));
$("#btn-clear").addEventListener("click",()=>{ layers=EMPTY(); active=0; render(); say("Recipe cleared."); });
$("#mode-smooth").addEventListener("click",()=>setMode(false));
$("#mode-steps").addEventListener("click",()=>setMode(true));

function render(){ renderRecipe(); renderShop(); markUsed(); drawSphere(); }
$("#version").textContent = "v"+VERSION;
setLight(...DEFAULT_LIGHT); migrateOld(); buildNav(); buildStrips(); buildNotes(); buildPresets(); renderSaved(); render();
</script>
</body>
</html>
